# Release pipeline: release-please, build and publish in ONE workflow,
# because tags and releases created with GITHUB_TOKEN do not trigger other
# workflows.
#
# On every push to main, release-please opens or updates the release PR
# ("chore(main): release X.Y.Z", with the Cargo.toml/Cargo.lock bump and
# CHANGELOG.md). Once that PR is merged, the next run creates the tag
# vX.Y.Z (force-tag-creation) and a DRAFT GitHub release, and the image
# job below builds, pushes and signs the release image and attaches its
# SBOM to the release.
#
# The release PR carries the code review this path needs: ci.yml runs on
# the push to main that merged it (the tag points at that same commit), and
# ci.yml's docker-build job proves the image builds on every PR before it
# is merged.
#
# Token: release-please uses secrets.RELEASE_PLEASE_TOKEN if it is set (a
# fine-grained PAT or a GitHub App token with contents: write and
# pull-requests: write on this repository), else the built-in GITHUB_TOKEN.
# With GITHUB_TOKEN:
#   - release PRs do not trigger CI (GitHub suppresses workflow runs for
#     events caused by GITHUB_TOKEN), so the required `ci-ok` check never
#     reports on them: merge them with an admin bypass, or set
#     RELEASE_PLEASE_TOKEN;
#   - "Allow GitHub Actions to create and approve pull requests" (Settings
#     > Actions > General) must be enabled, otherwise release-please cannot
#     open the release PR at all.
# No other secrets are used.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  # Pushes to main share one group, and a running push is never cancelled:
  # it may be in the middle of creating or publishing a release. Pull
  # requests and manual runs would get groups of their own if ever added.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/yornik/secure-file-share

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-26.04
    # Labels and comments on the release PR are covered by pull-requests:
    # write; issues: write is not needed.
    permissions:
      contents: write # push the release PR branch, create the tag and the draft release
      pull-requests: write # open/update the release PR and its labels
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Not in an environment on purpose: this job runs on every push to
          # main, and an environment approval would gate each one. The job
          # only runs on main, and the optional token needs no more than
          # contents + pull-requests write.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }} # zizmor: ignore[secrets-outside-env]
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    name: Build, push and sign the release image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      # Keyless cosign: the OIDC token is the signing identity, so there is
      # no long-lived key anywhere.
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The floating tag moves only for the newest release. Two releases cut
      # minutes apart can finish their builds in either order, and a re-run
      # of a flaked job lands after a later release: whichever happens,
      # :latest must not move backwards. The comparison is against the tags
      # on origin, so a tag that never produced an image holds it where it
      # is; declining to move it is a warning, not a silent skip.
      - name: Decide whether this release moves :latest
        id: tags
        env:
          VERSION: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          newest=$(git ls-remote --tags --refs --sort=-v:refname origin 'v*' |
            awk 'NR == 1 { sub(/.*refs\/tags\//, "", $2); print $2 }')
          if [ -z "$newest" ]; then
            echo "::error::origin carries no vX.Y.Z tag, so there is nothing to compare $VERSION against"
            exit 1
          fi
          highest=$(printf '%s\n%s\n' "$newest" "$VERSION" | sort -V | tail -n 1)
          {
            echo 'list<<END_OF_TAG_LIST'
            echo "${IMAGE}:${VERSION}"
            if [ "$highest" = "$VERSION" ]; then
              echo "${IMAGE}:latest"
            fi
            echo END_OF_TAG_LIST
          } >> "$GITHUB_OUTPUT"
          if [ "$highest" != "$VERSION" ]; then
            echo "::warning::$newest is a later release than $VERSION, so :latest was left where it is"
          fi

      - name: Build and push the release image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            VERSION=${{ needs.release-please.outputs.tag_name }}
            COMMIT=${{ github.sha }}
          # Ship a bill of materials and build provenance with the image, so
          # what is in a release is verifiable rather than asserted.
          sbom: true
          provenance: mode=max
          # No cache: every job that runs on main can write the shared
          # Actions cache, so a layer restored from it is a way for code
          # that is not in this repository to reach a signed image.

      # The cosign version is whatever this action pins (see its
      # action.yml), so digest-pinning the action pins cosign too.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Sign the index digest, which is what the tags above resolve to. The
      # annotations are the only part of the signature that names a release:
      # without them a signature says which workflow built an image but not
      # which version it was meant to be, and a moved :vX.Y.Z would still
      # verify. Nothing below v1.0.0 exists, so no version gate is needed
      # here; when one arrives it belongs in this comment.
      - name: Sign the image (keyless, GitHub OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          cosign sign --yes \
            -a "version=${TAG}" \
            -a "commit=${GITHUB_SHA}" \
            "${IMAGE}@${DIGEST}"

      # Run the exact command docs/verifying-releases.md tells third
      # parties to run, so if the doc is wrong or the signature is unusable
      # the release fails here rather than in someone else's admission
      # controller.
      - name: Verify the signature the way a third party would
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          # -a is what turns "built by this workflow" into "built by this
          # workflow as this release": cosign answers "missing or incorrect
          # annotation" for any other version, so asking for it on the tag
          # is what a moved tag fails.
          for ref in "${IMAGE}@${DIGEST}" "${IMAGE}:${TAG}"; do
            cosign verify \
              --certificate-identity "${IDENTITY}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              -a "version=${TAG}" \
              "$ref" > /dev/null
            echo "verified (exact identity and version): $ref"
          done
          # The regexp form is what a reader who does not know which
          # workflow cut the release will paste. Kept byte-identical to the
          # doc so this fails if the two drift apart.
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/Yornik/secure-file-share/\.github/workflows/release\.yml@refs/heads/main$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --certificate-github-workflow-repository 'Yornik/secure-file-share' \
            -a "version=${TAG}" \
            "${IMAGE}@${DIGEST}" > /dev/null
          echo "verified (documented regexp form): ${IMAGE}@${DIGEST}"

  # Separate job purely so contents:write lives nowhere near the build. The
  # SBOM is already attached to the image as an attestation; this republishes
  # that same document as a release asset so it can be read without pulling
  # anything.
  sbom:
    name: Attach the SBOM to the release
    needs: [release-please, image]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: read
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract the SBOM attestation from the pushed image
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" \
            --format '{{ json .SBOM }}' > sbom.raw.json
          # Single-platform builds nest the document under .SPDX;
          # multi-platform ones key it by platform first. Accept either.
          jq 'if has("SPDX") then .SPDX
              else ([.[] | select(type == "object" and has("SPDX")) | .SPDX] | first)
              end' sbom.raw.json > "secure-file-share-${TAG}-sbom.spdx.json"
          # Fail loudly rather than attaching an empty or null asset.
          jq -e '.spdxVersion and (.packages | length > 0)' \
            "secure-file-share-${TAG}-sbom.spdx.json" > /dev/null
          echo "extracted SBOM for ${IMAGE}@${DIGEST}"

      - name: Attach the SBOM to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "secure-file-share-${TAG}-sbom.spdx.json" --clobber
